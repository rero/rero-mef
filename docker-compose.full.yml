#
# This file is an example of what an Invenio production environment would look like.
# Here you can find a HAProxy load balancer which redirects the traffic to the web frontend, based on nginx.
# The user interface is the separate rero-mef-ui application, the REST API is served by rero-mef.
# There are also a celery worker backend, which can be monitored using Flower, and basics services such as
# a Redis cache, a database, a message broker (RabbitMQ) and ElasticSearch.
#
services:
  # Load balancer
  lb:
    extends:
      file: docker-services.yml
      service: lb
    links:
      - frontend
  # Frontend
  frontend:
    extends:
      file: docker-services.yml
      service: frontend
    links:
      - mef-ui
      - web-api
  # User interface (https://github.com/rero/rero-mef-ui)
  mef-ui:
    build:
      context: ../rero-mef-ui
      dockerfile: docker/Dockerfile
    image: rero-mef-ui
    restart: "unless-stopped"
    environment:
      # Public URL of the site: the browser calls the API there, on the same origin as the pages.
      - "API_URL=https://localhost"
      - "NG_ALLOWED_HOSTS=localhost"
    ports:
      - "4000"
  # API Rest Application
  web-api:
    extends:
      file: docker-services.yml
      service: app
    command: uv run uwsgi /invenio/var/instance/uwsgi_rest.ini
    image: rero-mef-web-api
    ports:
      - "5001"
    links:
      - cache
      - es
      - mq
      - db
  # Worker
  worker:
    extends:
      file: docker-services.yml
      service: app
    restart: "always"
    command: "uv run celery -A rero_mef.celery worker --loglevel=INFO"
    image: rero-mef-worker
    links:
      - cache
      - es
      - mq
      - db
  # Beat
  beat:
    extends:
      file: docker-services.yml
      service: app
    restart: "always"
    command: "uv run celery -A rero_mef.celery beat --loglevel=INFO"
    image: rero-ils-beat
    links:
      - cache
      - es
      - mq
      - db
  # Monitoring
  flower:
    extends:
      file: docker-services.yml
      service: flower
    links:
      - mq
  # Base services
  cache:
    extends:
      file: docker-services.yml
      service: cache
  db:
    extends:
      file: docker-services.yml
      service: db
  mq:
    extends:
      file: docker-services.yml
      service: mq
  es:
    extends:
      file: docker-services.yml
      service: es
